<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإدارة الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #1a1a1b; --green: #27ae60; --blue: #1a73e8; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .app { max-width: 450px; margin: 0 auto; background: #fff; border-radius: 25px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 4px solid #333; position: relative; }
        
        /* شريط الإدارة */
        .admin-nav { background: #222; color: #fff; padding: 12px; font-size: 0.7rem; display: flex; justify-content: space-around; }
        .admin-nav span { cursor: pointer; padding: 5px; border-radius: 5px; }
        .admin-nav span:hover { background: #444; }

        /* تنسيق البيانات القابلة للنقر */
        .clickable { cursor: pointer; transition: 0.2s; }
        .clickable:hover { background: #e3f2fd !important; border-radius: 8px; }

        /* النافذة المنبثقة (Popup) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 85%; max-width: 350px; border-radius: 20px; padding: 20px; text-align: center; position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { position: absolute; top: 10px; left: 10px; font-size: 1.5rem; cursor: pointer; color: #888; }
        
        .header-chart { padding: 15px; }
        .search-area { background: var(--dark); padding: 20px; margin: 15px; border-radius: 20px; color: white; }
        .input-group { background: white; border-radius: 10px; display: flex; align-items: center; padding: 5px 15px; margin-bottom: 10px; }
        .input-group input { border: none; width: 100%; outline: none; font-size: 0.8rem; }
        .btn-search { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #fff; font-weight: bold; cursor: pointer; }

        .profile-area { display: flex; align-items: center; padding: 15px; border: 1px solid #eee; margin: 15px; border-radius: 15px; background: #fdfdfd; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 15px; }
        .stat-card { background: #fff; padding: 12px; border-radius: 15px; border: 1px solid #eee; }
        .stat-card small { color: #888; font-size: 0.65rem; display: block; }

        .table-area { padding: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        td { padding: 12px 5px; border-bottom: 1px solid #f5f5f5; text-align: right; }
    </style>
</head>
<body>

<div class="app">
    <div class="admin-nav">
        <span onclick="addNewRow()"><i class="fas fa-plus"></i> إضافة مشترك</span>
        <span onclick="alert('تم تفعيل وضع التعديل الكامل')"><i class="fas fa-edit"></i> تعديل المعلومات</span>
    </div>

    <div class="header-chart">
        <canvas id="growthChart" height="150"></canvas>
    </div>

    <div class="search-area">
        <div class="input-group">
            <input type="text" id="searchIban" value="SA19 8000 0868 6080 1443 7809">
            <i class="fas fa-search" style="color:#ccc"></i>
        </div>
        <button class="btn-search" onclick="doSearch()">استعلام الآن</button>
    </div>

    <div id="resultBox" style="display:none">
        <div class="profile-area clickable" onclick="openPopup('محمد نجيب أحمد حيدره', 'مشترك موثق - رصيد الأرباح: SAR 40,300')">
            <div style="margin-left:10px; color:var(--blue)"><i class="fas fa-user-circle fa-2x"></i></div>
            <div>
                <h4 contenteditable="true" style="margin:0; font-size:0.9rem;">محمد نجيب أحمد أحمد حيدره</h4>
                <span style="color:var(--green); font-size:0.7rem">● اضغط لعرض الملف الكامل</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card clickable" onclick="openPopup('رقم الآيبان', 'SA19 8000 0868 6080 1443 7809')">
                <small>رقم الآيبان</small><b contenteditable="true">SA19 8000 ...7809</b>
            </div>
            <div class="stat-card clickable" onclick="openPopup('رقم الحساب', '077090010006084437809')">
                <small>رقم الحساب</small><b contenteditable="true">07709001...809</b>
            </div>
        </div>

        <div class="table-area">
            <h4>سجل العمليات</h4>
            <table id="userTable">
                <thead><tr><th>المشترك</th><th>المبلغ</th></tr></thead>
                <tbody>
                    <tr class="clickable" onclick="openPopup('تفاصيل فهد العتيبي', 'الحالة: تم تحويل الأرباح بنجاح\nالمبلغ: SAR 5,000')">
                        <td contenteditable="true">فهد العتيبي</td>
                        <td style="color:var(--green)">SAR 5,000+</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <div style="font-size: 3rem; color: var(--green); margin-bottom: 15px;"><i class="fas fa-id-card"></i></div>
        <h3 id="modalTitle">اسم الحقل</h3>
        <p id="modalBody" style="color: #666; line-height: 1.6; white-space: pre-line;"></p>
        <button onclick="closePopup()" style="background:var(--dark); color:white; border:none; padding:10px 20px; border-radius:10px; width:100%; margin-top:10px;">إغلاق</button>
    </div>
</div>

<script>
    // وظيفة فتح النافذة المنبثقة
    function openPopup(title, body) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = body;
        document.getElementById('myModal').style.display = 'flex';
    }

    function closePopup() {
        document.getElementById('myModal').style.display = 'none';
    }

    function doSearch() {
        const btn = document.querySelector('.btn-search');
        btn.innerText = "جاري جلب المعلومات...";
        setTimeout(() => {
            document.getElementById('resultBox').style.display = 'block';
            btn.innerText = "استعلام الآن";
        }, 700);
    }

    function addNewRow() {
        const table = document.getElementById('userTable').getElementsByTagName('tbody')[0];
        const row = table.insertRow();
        row.className = "clickable";
        row.onclick = function() { openPopup('مشترك جديد', 'تمت الإضافة يدوياً من لوحة التحكم'); };
        row.innerHTML = '<td contenteditable="true">اسم جديد</td><td style="color:var(--green)">SAR 0+</td>';
    }

    // الرسم البياني
    const ctx = document.getElementById('growthChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['1', '2', '3', '4', '5', '6', '7'],
            datasets: [{
                data: [35, 50, 45, 70, 60, 90, 85],
                borderColor: '#1a1a1b',
                tension: 0.4,
                fill: true,
                backgroundColor: 'rgba(26, 115, 232, 0.03)'
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { display: false } } }
    });
</script>
</body>
</html>
